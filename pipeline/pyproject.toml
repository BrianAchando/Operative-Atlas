[project]
name = "hilum-pipeline"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11",
  "nibabel>=5.2",
  "scikit-image>=0.22",
  "trimesh[easy]>=4.4",
  "fast-simplification>=0.1.9",
]

[project.optional-dependencies]
# segmentation step (pipeline/segment.py); large: pulls PyTorch
segment = ["TotalSegmentator>=2.4", "dicom2nifti>=2.4"]

[tool.uv]
package = false
